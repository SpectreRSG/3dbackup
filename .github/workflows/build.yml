# Builds the Windows .exe files on a Windows computer that GitHub lends us.
#
# * Every push: the .exe files are attached to the run as a download
#   (GitHub > Actions tab > click the run > "Artifacts" at the bottom).
# * A Release (public download on the Releases page, used by the website's
#   Download button) is published when:
#     - a version tag like "v1.0.0" is pushed,
#     - code is pushed to the main branch, or
#     - you run it by hand: Actions tab > Build Windows exe > Run workflow,
#       tick "Publish a release".
#   The release is named after the version in backup3d/__init__.py, so
#   bump that number for a new release.
name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab
    inputs:
      publish:
        description: "Publish a release"
        type: boolean
        default: false

permissions:
  contents: write      # needed to create a Release for version tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python (only used to build - the exe has its own copy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the automatic tests
        run: python -m unittest discover tests -v

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3

      - name: Build the exe files
        run: python packaging/build.py

      # Code signing stops Windows calling the app an "unknown publisher".
      # It only runs once the signing account is set up (see
      # docs/code-signing.md); until then the exe is built unsigned.
      # Pull requests from other people's copies never get signed.
      - name: Sign the exe files (Azure Artifact Signing)
        if: vars.SIGNING_ACCOUNT != '' && github.event_name != 'pull_request'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signature
        if: vars.SIGNING_ACCOUNT != '' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            Write-Host "$($_.Name): $($sig.Status) - $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($_.Name) is not signed correctly" }
          }

      - name: Check the exe works
        shell: pwsh
        run: |
          & ".\dist\3dbackup-cli.exe" --version
          & ".\dist\3dbackup-cli.exe" scan --all
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Put everything in a zip
        shell: pwsh
        run: |
          Copy-Item README.md dist\
          Compress-Archive -Path dist\* -DestinationPath 3D-Print-Backup-Windows.zip

      - name: Attach the zip to this run
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Print-Backup-Windows
          path: dist/

      - name: Work out the version number
        id: version
        shell: pwsh
        run: |
          $v = python -c "import backup3d; print(backup3d.__version__)"
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Publish a Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 3D Print Backup ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          body: |
            Download **3D-Print-Backup-Windows.zip** below, unzip it and double-click **3D Print Backup.exe**. No install needed.

            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.
          files: 3D-Print-Backup-Windows.zip
          make_latest: true
